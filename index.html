<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <header class="container-fluid p-5 bg-success text-white text-center">
        <h1>Ejercicios de Arreglos</h1>
    </header>
    <div class="container p-5 my-5 border text-center text-success">
        <h4>Captura las temperaturas de la semana para saber el promedio</h4>
        <button class="btn btn-secondary" onclick="captura() ">Captura temperaturas</button>
        <button class="btn btn-success" onclick="promedio()">Mostrar promedio </button>

        <p id="minima"></p>
        <p id="maxima"></p>
        <p id="promedio"></p>
    </div>
    <div class="container p-5 my-5 border text-center text-success">
        <h3>Dibujar Número 8</h3>
        <button class="btn btn-secondary" onclick="dibujarOcho()">
            Dibujar
        </button>
        <div id="resultadoOcho" class="text-center"></div>
    </div>
    <div class="container p-5 my-5 border text-center text-success">
        <h3>Gestión de Alumnos</h3>
        <button class="btn btn-secondary" onclick="gestionarAlumnos()">
            Iniciar 
        </button>
        <div id="resultadoAlumnos" class="text-center"></div>
    </div>

    <div class="container p-5 my-5 border text-center text-success">
        <h3>Agenda de la semana </h3>
        <button class="btn btn-secondary" onclick="agenda_definicion()">
            Iniciar
        </button>
        <div id="impAgenda" class="text-center"></div>
    </div>

    <script src="js/arreglos.js"></script>
</body>

</html>
